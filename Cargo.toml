[package]
name = "wa-encoder-rs"
version = "0.1.0"
edition = "2021"
description = "Native Rust WeakAura encoder/decoder MCP server"
authors = ["STRYK"]

[dependencies]
flate2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }

# MCP Server
rmcp = { version = "0.8", features = ["server", "transport-io"] }
schemars = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[lib]
name = "wa_encoder"
path = "src/lib.rs"

[[bin]]
name = "wa-encoder-rs"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
